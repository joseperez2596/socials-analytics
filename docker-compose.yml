# Settings come from .env (see .env.example). Defaults work for a local demo.
services:
  analytics-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: analytics
    volumes:
      - analytics_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    networks:
      - analytics
    restart: unless-stopped

  analytics-dashboard:
    build: .
    ports:
      - "${APP_PORT:-3030}:3000"
    environment:
      DATABASE_URL: postgresql://analytics:${POSTGRES_PASSWORD:-changeme}@analytics-db:5432/analytics
      DASHBOARD_TITLE: ${DASHBOARD_TITLE:-Social Analytics}
      PILLARS_FILE: ${PILLARS_FILE:-}
    volumes:
      - app_data:/app/data   # encryption key for platform logins; keep it with your DB backups
    depends_on:
      - analytics-db
    networks:
      - analytics
    restart: unless-stopped

# Fixed names so other stacks (e.g. a sync tool) can join the network and the data survives renames.
networks:
  analytics:
    name: analytics

volumes:
  analytics_data:
    name: analytics_data
  app_data:
    name: analytics_app_data
